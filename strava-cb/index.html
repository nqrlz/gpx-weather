<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strava verbinden…</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #09090b;
      color: #a1a1aa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #3f3f46;
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0; font-size: 14px; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p id="msg">Strava verbinden…</p>
  </div>

  <script>
    const params  = new URLSearchParams(window.location.search);
    const code    = params.get('code');
    const state   = params.get('state');
    const scope   = params.get('scope');
    const error   = params.get('error');
    const next    = params.get('next');   // z.B. http://localhost:3000

    function showError(msg) {
      document.getElementById('msg').textContent = msg;
      document.getElementById('msg').className = 'error';
    }

    if (error) {
      showError('Strava-Verbindung abgelehnt: ' + error);
    } else if (!code) {
      showError('Kein Code von Strava erhalten.');
    } else if (!next) {
      showError('Kein Ziel angegeben (next fehlt).');
    } else {
      // Baue die Ziel-URL zusammen
      try {
        const target = new URL('/api/strava/callback', next);
        target.searchParams.set('code', code);
        if (state) target.searchParams.set('state', state);
        if (scope) target.searchParams.set('scope', scope);
        window.location.replace(target.toString());
      } catch (e) {
        showError('Ungültige Ziel-URL: ' + next);
      }
    }
  </script>
</body>
</html>
